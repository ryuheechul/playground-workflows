# A workflow that calls all other reusable workflows in the same repository using the $/ syntax.
name: 'Call Workflows with Dollar Syntax'

# NOTE: See:
# - https://docs.github.com/en/actions/how-tos/reuse-automations/reuse-workflows#calling-a-reusable-workflow
# - as well as https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax#example-using-an-action-in-the-same-repository-as-the-workflow-at-the-running-commit-recommended

# INFO: Looking for dollar syntax for Actions? ./call-actions-with-dollar-syntax.yml

on:
  workflow_call: {}

jobs:
  call-hello:
    uses: $/.github/workflows/hello.yml
    with:
      name: 'Dollar Syntax Workflow User'

  call-local-action-wf:
    uses: $/.github/workflows/call-local-action.yml
    with:
      who: 'Dollar Syntax Action Caller'

  call-multi-file-actions-wf:
    uses: $/.github/workflows/call-multi-file-actions.yml
    with:
      message: 'Hello from workflow via $/'
